<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>React context</title>
        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <!-- Agregar el script de Babel -->
        <script src="https://unpkg.com/@babel/standalone"></script>
        <script type="text/babel" src="components/MyButton.js"></script>
        <script type="text/babel" src="/context/count-context.js"></script>
    </head>
    <body>
        <div id="root">
            
        </div>
        
    </body>
    <script type="text/babel">
        const {createContext, useState} = React;
        const { CountContext, CountContextProvider } = window;
        const userContext = createContext(null);

        function App() {
            const [count, setCount] = useState(0);
            const [countResta, setCountResta] = useState(0);
            const [user, setUser] = useState(
                {name: 'Eduardo', age: 21, email: 'eduardo@gmail.com'}
            );
            return (
                <div>
                    <h2>Con el nuevo contexto desde JS</h2>
                    <CountContextProvider value={{ count, setCount, countResta, setCountResta }}>
                        <Component1 />
                        <Component2 />
                    </CountContextProvider>

                    <userContext.Provider value={{user, setUser}}> 
                        <ProfileUser />
                        <SearchUser />
                    </userContext.Provider>
                </div>
            );
        }

        function ProfileUser(){
            const {user, setUser} = React.useContext(userContext);
            return(
                    <div>
                        <h2> Perfil de usuario</h2>
                        <p> Nombre: {user.name}</p>
                        <p> Edad: {user.age}</p>
                        <p> Email: {user.email}</p>
                    </div>          
            )
        }

        function SearchUser(){
            const {user, setUser} = React.useContext(userContext);
            return(
                <div>
                    <h2> Buscar usuario</h2>
                    <label for="">Nombre a buscar</label>
                    <input value={user.name} onChange={BuscarUsuario}/>

                    <label for="">Edad a buscar</label>
                    <input type="text" value={user.age} />

                    <label for="">Email a buscar</label>
                    <input type="text" value={user.email} />

                </div>
            )
        }

        function BuscarUsuario(){
            const {user, setUser} = React.useContext(userContext);
            console.log(event.target.value);
            /*
            setUser({
                name: 'Eduardo',
                age: 21,
                email: 'eduardo@gmail.com'
            }) */
           setUSer({
                name: event.target.value,        
           })
        }

        function Component1() {
            const { count, setCount } = React.useContext(CountContext);
            console.log("Render Componente 1");
            return (
                <div>
                    <h1>Componente 1</h1>
                    <p>Contador: {count}</p>
                    <button onClick={() => setCount(count + 1)}>Incrementar</button>
                </div>
            );
        }

        function Component2() {
            const { countResta, setCountResta } = React.useContext(CountContext);
            console.log("Render Componente 2");
            return (
                <div>
                    <h1>Componente 2</h1>
                    <p>Contador: {countResta}</p>
                    <button onClick={() => setCountResta(countResta - 1)}>Restar</button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</html>
